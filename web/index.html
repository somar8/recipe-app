<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build`; "/" by default. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your recipes and collections, on any device.">
  <meta name="theme-color" content="#2E7D32">

  <!-- Installing on iPhone: Safari > Share > Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Recipe App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #ffffff; }
    /* Shown while Flutter loads (about 2-3 MB on the first visit). */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 16px; font-family: system-ui, sans-serif; color: #2E7D32; }
    #loading .spinner { width: 36px; height: 36px; border: 4px solid #C8E6C9; border-top-color: #2E7D32;
                        border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { body { background: #121212; } #loading { color: #A5D6A7; } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="spinner"></div>
    <div>Loading Recipe App…</div>
  </div>
  <script>
    // Remove the loading screen as soon as Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
